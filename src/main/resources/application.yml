server:
  port: 8666
  servlet:
    context-path: /api
    # 文件上传体积限制
    # 两个都必须显式配置：max-file-size 管单个文件，max-request-size 管整个 multipart 请求体。
    # 只配 max-file-size 时，multipart 解析仍会被请求体上限拦下，
    # 表现为「超过 1MB 的文件上传必失败」，且错误信息被包装成笼统的系统错误，很难排查。
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  tomcat:
    # 请求被拒绝时允许吞掉的字节数，避免大文件失败后连接被直接断开
    max-swallow-size: 20MB

spring:
  profiles:
    active: local
  application:
    name: yu-picture-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/picture
    username: root
    password: 748374075
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.lsj.demo.controller

