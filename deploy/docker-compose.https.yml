# HTTPS 叠加配置（compose override）
#
# 用法：
#   docker compose --env-file deploy/.env \
#     -f deploy/docker-compose.yml \
#     -f deploy/docker-compose.https.yml up -d --build
#
# 它把 front 服务改成：开放 443、用 https.conf、并把宿主机证书目录挂进容器。
# 证书请放在宿主机 /etc/nginx/ssl/ 下（不要提交到仓库，也不进镜像）。

services:
  front:
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
