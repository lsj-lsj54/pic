server {
    listen 80;
    server_name _;

    server_tokens off;

    client_max_body_size 20m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # 与 default.conf 的唯一区别：**不打开缓存开关**
    #
    # default.conf 会把 front/config.js 里的
    #   window.__USE_CACHE__ = false  →  true
    # 让首页走 /picture/list/page/vo/cache 接口。
    # 那个接口依赖 Redis；在没部署 Redis 的环境（免费方案为了省内存通常就不装）
    # 会连接失败，首页会直接加载不出来。
    #
    # 所以不装 Redis 时用这份配置：只替换后端地址，缓存开关保持 false。
    # sub_filter_types 依然必须显式声明，否则 config.js（application/javascript）
    # 的替换会静默失效，所有接口会打到访问者自己的 localhost。
    # ---------------------------------------------------------------------
    sub_filter_types text/html application/javascript text/javascript text/css;
    sub_filter "window.__API_BASE__ = ''" "window.__API_BASE__ = '/api'";
    sub_filter_once on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/(config\.js|js/|css/) {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        sub_filter_types application/javascript text/javascript text/css;
        sub_filter "window.__API_BASE__ = ''" "window.__API_BASE__ = '/api'";
        sub_filter_once on;
    }

    location /api/ {
        proxy_pass http://app:8666;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter_types "";
        sub_filter_once off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
