# HTTPS 站点配置（腾讯云免费 SSL 证书）
#
# 什么时候用：域名已解析到服务器，且在腾讯云申请了免费证书（SSL 证书控制台 → 申请免费证书 →
# 下载「Nginx」格式，会得到 <域名>.crt（或 _bundle.crt）与 <域名>.key 两个文件）。
#
# 启用方式（不要直接覆盖 default.conf）：
#   1. 把证书放到服务器 /etc/nginx/ssl/ 下：
#        /etc/nginx/ssl/picture.example.com.crt
#        /etc/nginx/ssl/picture.example.com.key
#      chmod 600 /etc/nginx/ssl/*.key
#   2. 用 override 文件叠加启动：
#        docker compose --env-file deploy/.env -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml up -d
#
# 注意：证书文件不在仓库里，也不进镜像，通过挂载进容器。

# HTTP：全部跳到 HTTPS（腾讯云证书校验、以及用户习惯访问 http 的兜底）
server {
    listen 80;
    server_name picture.example.com;

    # 保留安全头，避免这一层裸奔
    add_header X-Content-Type-Options "nosniff" always;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name picture.example.com;

    # ↓↓↓ 换成你自己的证书文件名（腾讯云下载的 Nginx 格式）
    ssl_certificate     /etc/nginx/ssl/picture.example.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/picture.example.com.key;

    # 只留安全的协议与套件，去掉 SSLv3/TLS1.0/1.1
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 会话票据关掉，避免前向安全性打折（代价是握手略多一次）
    ssl_session_tickets off;

    server_tokens off;

    client_max_body_size 20m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：先确认 https 完全正常、且以后不再回退到 http，再开启（开启后浏览器会强制 https）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 与 default.conf 一致：sub_filter 必须显式声明 types，
    # 否则 config.js（application/javascript）的替换会静默失效
    sub_filter_types text/html application/javascript text/javascript text/css;
    sub_filter "window.__API_BASE__ = ''" "window.__API_BASE__ = '/api'";
    sub_filter "window.__USE_CACHE__ = false" "window.__USE_CACHE__ = true";
    sub_filter_once on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* ^/(config\.js|js/|css/) {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        sub_filter_types application/javascript text/javascript text/css;
        sub_filter "window.__API_BASE__ = ''" "window.__API_BASE__ = '/api'";
        sub_filter "window.__USE_CACHE__ = false" "window.__USE_CACHE__ = true";
        sub_filter_once on;
    }

    location /api/ {
        proxy_pass http://app:8666;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 后端如果以后要生成绝对地址（如回调、跳转），靠这个头才知道外部是 https
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter_types "";
        sub_filter_once off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
