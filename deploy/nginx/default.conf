server {
    listen 80;
    server_name _;

    # 上传接口允许的请求体大小，要 >= 后端 spring.servlet.multipart 的限制
    client_max_body_size 20m;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 静态资源缓存
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 部署时把前端请求的后端地址改成相对路径 /api
    #
    # 做法是从 config.js 响应里做文本替换：把 window.__API_BASE__ = '' 改成 '/api'。
    # 因此 front/config.js 里那个空字符串的写法是这个替换的锚点，改动它要同步改这里。
    # 如果不用 sub_filter，也可以直接把 front/config.js 里的值写死成 '/api'。
    sub_filter "window.__API_BASE__ = ''" "window.__API_BASE__ = '/api'";
    sub_filter_once on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 前端是 hash 路由，理论上不需要重写；保留以便以后改成 history 路由
        try_files $uri $uri/ /index.html;
    }

    # 前端配置与源码不做长缓存，改了能立刻生效
    location ~* ^/(config\.js|js/|css/) {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        sub_filter "window.__API_BASE__ = ''" "window.__API_BASE__ = '/api'";
        sub_filter_once on;
    }

    # 接口反向代理到后端容器
    # proxy_pass 不带结尾斜杠，原始 URI（含 /api 前缀）会原样转发，
    # 正好对应后端 application.yml 里的 context-path: /api
    location /api/ {
        proxy_pass http://app:8666;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传和批量抓取耗时较长，超时要放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
