server {
    listen 80;
    server_name _;

    # 不在响应头里暴露 nginx 版本号
    server_tokens off;

    # 上传接口允许的请求体大小，要 >= 后端 spring.servlet.multipart 的限制（后端是 10MB）
    client_max_body_size 20m;

    # 日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # 运行时配置替换：把前端请求的后端地址改成相对路径 /api
    #
    # 做法是从 config.js 响应里做文本替换：window.__API_BASE__ = '' → '/api'。
    # 因此 front/config.js 里那两行的写法就是这个替换的锚点，改动前端要同步改这里。
    #
    # 【重要】sub_filter 默认只作用于 text/html。
    # 而 config.js 的 Content-Type 是 application/javascript，
    # 不显式声明 sub_filter_types 的话替换会「静默失效」：
    #   window.__API_BASE__ 保持空字符串 → api.js 回退到 http://localhost:8666/api
    #   → 浏览器去访问访问者自己电脑的 localhost → 生产环境所有接口全部失败，
    #     而且页面本身能打开、控制台不一定报错，非常难排查。
    # ---------------------------------------------------------------------
    sub_filter_types text/html application/javascript text/javascript text/css;
    sub_filter "window.__API_BASE__ = ''" "window.__API_BASE__ = '/api'";
    sub_filter "window.__USE_CACHE__ = false" "window.__USE_CACHE__ = true";
    sub_filter_once on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # 前端是 hash 路由，理论上不需要重写；保留以便以后改成 history 路由
        try_files $uri $uri/ /index.html;
    }

    # 前端配置与源码不做长缓存，改了能立刻生效
    location ~* ^/(config\.js|js/|css/) {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        # 这里正是 config.js 走的 location，显式再声明一次，不留继承的模糊地带
        sub_filter_types application/javascript text/javascript text/css;
        sub_filter "window.__API_BASE__ = ''" "window.__API_BASE__ = '/api'";
        sub_filter "window.__USE_CACHE__ = false" "window.__USE_CACHE__ = true";
        sub_filter_once on;
    }

    # 接口反向代理到后端容器
    # proxy_pass 不带结尾斜杠，原始 URI（含 /api 前缀）会原样转发，
    # 正好对应后端 application.yml 里的 context-path: /api
    location /api/ {
        proxy_pass http://app:8666;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 接口响应不做内容替换，关掉省一层扫描开销
        sub_filter_types "";
        sub_filter_once off;

        # 上传和批量抓取耗时较长，超时要放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
